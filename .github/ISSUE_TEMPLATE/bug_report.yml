name: Bug report
description: Something crashed, froze or looks wrong.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A screenshot helps. If it crashed, press Ctrl+Alt+V and take a photo of that screen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How do I make it happen?
      description: The keys you pressed or the app or game you opened.
    validations:
      required: false
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Relic OS version, VM software (VMware, VirtualBox, QEMU...) or real hardware, live CD or installed.
      placeholder: v0.4.0, VMware Workstation 17, installed
    validations:
      required: true
